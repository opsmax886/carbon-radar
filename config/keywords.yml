# ---------- 触发词:命中任一即进入候选池 ----------
# 上面 tracks 的 keywords 会自动并入触发词,这里补充"泛双碳"词,
# 用于捕捉那些不属于任何具体业务线、但仍与你相关的信息。
triggers_extra:
  - 碳排放
  - 二氧化碳排放
  - 温室气体
  - 甲烷
  - 碳减排
  - 气候
  - 低碳
  - 碳中和管理体系
  - 碳管理体系
  - 碳信息披露
  - 碳达峰碳中和

# ---------- 排除词:强力降噪 ----------
# 这是防止"碳刷/碳酸钙/碳纤维"之类噪声的关键。
# 命中排除词且未命中任何业务线关键词的信息会被直接丢弃。
exclude:
  - 碳纤维
  - 碳刷
  - 碳酸钙
  - 碳酸锂
  - 碳酸钠
  - 碳酸氢钠
  - 碳酸饮料
  - 碳化硅
  - 碳素
  - 碳粉
  - 碳带
  - 碳钢
  - 渗碳
  - 积碳
  - 碳纳米管
  - 石墨烯
  - 碳化钨
  - 碳晶
  - 碳膜
  - 碳棒
  - 碳砖
  - 活性炭
  - 碳黑
  - 炭黑
  - 碳渣
  - 碳泥
  - 碳水化合物
  - 碳五
  - 碳九
  - 碳四
  - 碳陶
  - 碳纤维复合材料
  - 碳素钢
  - 高碳铬铁
  - 碳化炉
  - 碳硫分析

# ---------- 高价值信号:命中后额外加分 ----------
# 用于把"真正能投的标"排到前面。
signal_boost:
  budget:                 # 出现预算金额
    keywords: [预算, 万元, 采购预算, 最高限价, 控制价]
    boost: 12
  tender_action:          # 明确的招标动作
    keywords: [公开招标, 竞争性磋商, 竞争性谈判, 询比, 询价, 比选, 招标公告, 采购公告, 邀请招标]
    boost: 18
  near_deadline:          # 有投标截止
    keywords: [投标截止, 响应文件, 递交截止, 开标时间]
    boost: 8
  winner:                 # 中标/成交(用于跟踪竞争对手)
    keywords: [中标公告, 成交公告, 中标结果, 成交结果, 中标候选人]
    boost: -5             # 已结束,降权

