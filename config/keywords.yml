# ============================================================
# 碳雷达 · 关键词库与业务线权重
# ------------------------------------------------------------
# 这是整个系统最核心的资产。系统的"聪明程度"主要取决于这个文件,
# 而不是代码。你可以随时修改,下次运行立即生效,无需改任何代码。
#
# 打分逻辑(完全可解释,不依赖 AI):
#   每条信息会逐条匹配下面各业务线的关键词。
#   标题命中权重 25 分/词, 正文命中 8 分/词, 乘以业务线 weight,
#   取所有业务线中的最高分作为"业务匹配度"(上限 100)。
#   页面上会显示"命中:碳核查、温室气体清单",你能看到分数的来源。
# ============================================================

# ---------- 业务线:权重决定打分倾斜 ----------
tracks:

  carbon_verification:
    label: 碳核查 / 温室气体排放核查
    weight: 1.15          # 你的主力业务(对应已有的派组工具),略高
