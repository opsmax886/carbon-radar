name: 碳雷达每日更新

# ---------------------------------------------------------------
# 时区提醒:GitHub Actions 的 cron 用的是 UTC 时间,比北京时间早 8 小时!
# 换算公式:UTC 时间 = 北京时间 - 8 小时
#   北京时间 09:12 → UTC 01:12 → '12 1 * * *'   ← 当前设置
#   北京时间 08:30 → UTC 00:30 → '30 0 * * *'
# 注意:UTC 19:00-23:00 对应北京时间次日凌晨,cron 的日期会往前差一天。
#
# ⚠️ 为什么不用整点(09:00)?
#   GitHub 官方文档明确说:schedule 事件在【每个整点】属于高负载时段,
#   任务可能被延迟几十分钟、甚至直接丢弃,建议避开整点。
#   实测把 cron 设为 '0 1 * * *' 后,09:00 到了 10 分钟都没触发。
#   所以改成 01:12 UTC(北京 09:12),并加一个备用时段兜底。
#
# 备用时段的意义:万一一早那次被 GitHub 丢弃,10:42 那次会补上。
# 不会重复推送 —— 程序用 data/pushed.json 记录"已成功推送过哪些条目",
# 而且同一天已经推过就不会再发"平安消息"。
# ---------------------------------------------------------------
on:
  schedule:
    - cron: '12 1 * * *'    # 北京时间每天 09:12(主)
    - cron: '42 2 * * *'    # 北京时间每天 10:42(备用,仅当主时段被丢弃时起作用)
  workflow_dispatch:        # 也支持在网页上手动点一下立即运行

permissions:
  contents: write           # 需要写权限才能把新数据提交回仓库
  pages: write
  id-token: write

concurrency:
  group: carbon-radar
  cancel-in-progress: false

jobs:
  # ============ 第一步:抓取 + 分析 + 推送 + 提交数据 ============
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行碳雷达
        env:
          # 以下密钥请在仓库 Settings → Secrets and variables → Actions 里配置
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 可选:企业微信 / 飞书
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python src/main.py

      # 即使上一步失败(比如钉钉推送失败)也要把数据提交上去,
      # 否则网页看板会跟着一起停更 —— 两件事应该解耦。
      - name: 提交更新后的数据
        if: always()
        run: |
          git config user.name  "carbon-radar-bot"
          git config user.email "carbon-radar-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "数据无变化,跳过提交"
            exit 0
          fi
          git commit -m "数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          # 源探测工作流可能同时在提交,直接 push 会被拒(非快进)。
          # 先 rebase 再推,并重试几次。
          BRANCH="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "推送成功"; break
            fi
            echo "第 $i 次推送失败,5 秒后重试…"; sleep 5
          done

      - name: 保存网页产物(备用,可在 Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: carbon-radar-web
          path: web/
          retention-days: 30

  # ============ 第二步:发布到 GitHub Pages(可选) ============
  # ⚠️ 免费版 GitHub 账号只能从【公开仓库】发布 Pages。
  #    所以这里做了自动判断:
  #      · 公开仓库  → 尝试发布网页看板
  #      · 私有仓库  → 自动跳过(不会报错)
  #    如果你还没在 Settings → Pages 里开通,这一步会失败但不影响整体,
  #    continue-on-error 保证工作流仍然显示为成功(绿色)。
  deploy:
    needs: update
    # 用 != 'private' 而不是 == 'public':万一取不到可见性,宁可尝试一次
    # (失败了也被 continue-on-error 兜住),也不要永远静默不发布
    if: github.event.repository.visibility != 'private'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取最新提交(含刚推送的数据)
        uses: actions/checkout@v4
        with:
          # 关键:默认签出的是"触发本次运行的那个旧提交",会漏掉 update 任务刚推上来的新数据,
          # 导致看板永远比钉钉推送落后一天。这里显式签出默认分支的最新提交。
          ref: ${{ github.event.repository.default_branch }}

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 web 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
